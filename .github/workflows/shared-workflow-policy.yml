name: Shared workflow policy
on:
  pull_request:
    paths: [".github/workflows/**"]
  push:
    branches: [main]
    paths: [".github/workflows/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    uses: codeandsolder/ci-workflows/.github/workflows/workflow-concurrency.yml@4c7fc62a9f9ec37aaa7c155d263cd5025e446a53 # main
